phone:
  # الصيغة النهائية الصحيحة لرقم جوال سعودي بعد التطبيع: 966 + 5 + 8 أرقام = 12 رقم إجمالًا
  # (مثال: 966564104141). تنبيه: طلب المستخدم الأصلي ذكر "13 رقم" وهذا خطأ عد بسيط على الأغلب،
  # لأن أي رقم جوال سعودي فعلي مكوّن من 966 (3) + 5XXXXXXXX (9) = 12 رقمًا فقط.
  valid_pattern: "^9665\\d{8}$"

paths:
  output_dir: "output"
  db_path: "db/dedup.sqlite3"
