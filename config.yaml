# إعدادات صفحة "Inbound Call" (استيراد تصدير Maqsam وتعبية شيت المزروع تلقائيًا من Call Summary).
call_import:
  # "rules": استخراج مجاني بمطابقة كلمات مفتاحية (src/rule_extraction.py) — أقل دقة لكن بدون أي تكلفة،
  #          وهو الوضع الافتراضي حاليًا (الحساب الحالي بلا رصيد Anthropic API).
  # "claude": استخراج أدق عبر Claude API (src/call_extraction.py) — يتطلب ANTHROPIC_API_KEY ورصيد فعلي
  #           بحساب Anthropic. بدّل لهذا الوضع فقط بعد إضافة رصيد حقيقي بـ console.anthropic.com.
  extraction_mode: "rules"
  anthropic_model: "claude-haiku-4-5-20251001"
  batch_size: 20
  # القيمة الكاملة الحالية لعمود Details بشيت المزروع (مجمّعة من كل تبويبات الوكيلات فعليًا) —
  # تُستخدم كقائمة الخيارات المسموحة عند تصنيف نص Call Summary. حدّثها دوريًا إذا ظهرت قيم جديدة
  # بالشيت الحقيقي لم تكن موجودة هنا وقت الإنشاء.
