# إعدادات نظام تحديد العملاء الأوفلاين
# عدّل هذا الملف فقط عند تغيّر أسماء الأعمدة أو إضافة براندات جديدة — لا حاجة لتعديل الكود.

google_sheets:
  spreadsheet_id: "1YNwUrHmWyKZPBgyWVffV8yrhqMUg4sguoH_lBLuhG1M"
  # مسار ملف Service Account JSON. يُقرأ من متغير البيئة GOOGLE_APPLICATION_CREDENTIALS إن وُجد،
  # وإلا يُستخدم هذا المسار كقيمة افتراضية.
  credentials_path: "credentials/service_account.json"
  tabs:
    Sara:
      gid: 239476091
    Raghad:
      gid: 575745816
    Njoud:
      gid: 156606516
  # تبويب منفصل تمامًا عن Sara/Raghad/Njoud — يُستخدم فقط بلوحة التحكم (Dashboard)، وليس بمنطق
  # المطابقة الأساسي. يحتوي عمود "Online/Offline" جاهز كمؤشر مباشر (بدون إعادة تشغيل أي مطابقة).
  sales_data_tab:
    name: "Sales Data"
    gid: 0
  # ترتيب الأعمدة كما هو فعليًا في كل تبويب
  columns:
    - Name
    - Number
    - Inbound calls/out bound calls
    - Call Status
    - "WhatsApp&Calls"
    - Social Media
    - Subject
    - Details
    - Status
    - Date
    - company
    - Satisfied/or not
    - How did you hear about us
    - Remark
    - Agent
    - Show Room

# أسماء الأعمدة المحتملة بملف الفواتير (Excel/CSV) — القائمة تدعم أكثر من اسم بديل
# لأن أسماء الأعمدة تختلف بين التصديرات (مثال فعلي: BrandName بدل Brand Name، Textbox230 بدل Customer Info)
invoice_columns:
  customer_info: ["Customer Info", "Textbox230"]
  date: ["Date", "InvoiceDate"]
  sales_order_id: ["Sales Order ID", "SalesId", "SalesID"]
  sales_type: ["Sales Type", "SalesTypeLabel"]
  create_by: ["Create by", "createdBy"]
  brand: ["Brand", "ProdGroupId"]
  brand_name: ["Brand Name", "BrandName"]
  sales_man: ["Sales Man", "SalesName"]
  sales_man_id: ["Sales Man ID", "PersonnelNumber"]
  category: ["Category", "Textbox14"]
  category_name: ["Category Name", "CatName"]
  delivery_wh: ["Delivery WH", "inventLocationId1"]
  item_code: ["Item Code", "Textbox228"]
  description: ["Description", "Name1"]
  store_id: ["Store ID", "Store", "inventLocationId"]
  # مبلغ السطر — "Total Amount" هو الاسم الفعلي بملف الفواتير الحقيقي (سعر × كمية، قبل الخصم)
  amount: ["Total Amount", "Amount"]
  # مصدر مطابقة البراند الوحيد (انظر matcher.resolve_canonical_brand_from_show_room) — ليس Brand/Brand Name
  show_room: ["Show Room", "ShowRoomDescription"]

# قيم عمود Details التي تستبعد الرقم فورًا (مطابقة case-insensitive وتجاهل المسافات الزائدة)
# ملاحظة: "Offers" ليست هنا عمدًا — تُحسب كسبب مؤهل لتصنيف العميل كأوفلاين
exclusion_details:
  - "Support Email"
  - "Job Email"
  - "Maintenance"
  - "Delivery Time"
  - "order"

# قاموس مطابقة البراند: يربط بادئة كود العميل/المتجر بملف الفواتير مع القيم المستخدمة
# بعمود company بشيت المزروع. أضف براندات جديدة هنا فقط عند ظهورها بملفات مستقبلية.
brand_dictionary:
  BedQuarterKSA:
    invoice_codes: ["BQ"]
    sheet_aliases: ["BedQuarterKSA", "BQ", "Bed Quarter", "Bed Quarter KSA"]
  BedHouse:
    invoice_codes: ["BH"]
    sheet_aliases: ["Bed House", "BH", "BedHouse"]
  LaZBoy:
    invoice_codes: ["LAZ", "LZ"]
    sheet_aliases: ["LA-Z-BOY", "La-Z-Boy", "Laz Boy", "LAZBOY"]

phone:
  # الصيغة النهائية الصحيحة لرقم جوال سعودي بعد التطبيع: 966 + 5 + 8 أرقام = 12 رقم إجمالًا
  # (مثال: 966564104141). تنبيه: طلب المستخدم الأصلي ذكر "13 رقم" وهذا خطأ عد بسيط على الأغلب،
  # لأن أي رقم جوال سعودي فعلي مكوّن من 966 (3) + 5XXXXXXXX (9) = 12 رقمًا فقط.
  valid_pattern: "^9665\\d{8}$"

paths:
  output_dir: "output"
  db_path: "db/dedup.sqlite3"
